<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body{
            font-family: Arial;
            background:#d9edf7;
            text-align:center;
            margin-top:100px;
        }

        .login-box{
            width:300px;
            margin:auto;
            padding:20px;
            background:rgb(168, 22, 22);
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
        }

        button{
            width:95%;
            padding:10px;
            background:blue;
            color:white;
            border:none;
            cursor:pointer;
        }

        button:hover{
            background:darkblue;
        }

        #msg{
            color:red;
        }
    </style>

</head>

<body>

<div class="login-box">

<h2>User Login</h2>

<input type="text" id="username" placeholder="Enter Username">

<input type="password" id="password" placeholder="Enter Password">

<p id="msg"></p>

<button onclick="validate()">Login</button>

</div>

<script>

function validate()
{
    let user=document.getElementById("username").value;
    let pass=document.getElementById("password").value;

    if(user=="")
    {
        document.getElementById("msg").innerHTML="Username cannot be empty";
        return;
    }

    if(pass=="")
    {
        document.getElementById("msg").innerHTML="Password cannot be empty";
        return;
    }

    if(user=="admin" && pass=="1234")
    {
        window.location.href="success.html";
    }
    else
    {
        document.getElementById("msg").innerHTML="Invalid Username or Password";
    }

}

</script>

</body>
</html>
